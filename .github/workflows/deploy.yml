name: Build and deploy site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run build-time export script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run export

      - name: Compare content with live site
        id: check_diff
        run: |
          LIVE_URL="${{ steps.pages.outputs.base_url }}/content.json"
          echo "Checking live content from: $LIVE_URL"
          HTTP_STATUS=$(curl -s -o /tmp/live_content.json -w "%{http_code}" "$LIVE_URL" || echo "000")
          echo "Live content response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "No live site or failed to fetch content ($HTTP_STATUS). Treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            if cmp -s public/content.json /tmp/live_content.json; then
              echo "Content is identical."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Content has changed."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Determine if build and deploy should proceed
        id: should_deploy
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.check_diff.outputs.changed }}" = "false" ]; then
            echo "Scheduled hourly run and content is unchanged. Skipping build & deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Build and deploy will proceed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore licensed fonts from secrets
        if: steps.should_deploy.outputs.deploy == 'true'
        env:
          FONT_BESPOKE_STENCIL_BOLD: ${{ secrets.FONT_BESPOKE_STENCIL_BOLD }}
          FONT_SUPREME_REGULAR: ${{ secrets.FONT_SUPREME_REGULAR }}
        run: |
          mkdir -p public/fonts
          echo "$FONT_BESPOKE_STENCIL_BOLD" | base64 -d > public/fonts/BespokeStencil-Bold.woff2
          echo "$FONT_SUPREME_REGULAR" | base64 -d > public/fonts/Supreme-Regular.woff2

      - name: Build site
        if: steps.should_deploy.outputs.deploy == 'true'
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/Sons-of-damascene/' }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Generate SPA route files
        if: steps.should_deploy.outputs.deploy == 'true'
        run: npm run routes

      - name: Verify bundle isolation
        if: steps.should_deploy.outputs.deploy == 'true'
        run: node scripts/verify-bundle.mjs

      - name: Upload GitHub Pages artifact
        if: steps.should_deploy.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.should_deploy.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
