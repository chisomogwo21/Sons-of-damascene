name: Build and deploy site

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore licensed fonts from secrets
        env:
          FONT_BESPOKE_STENCIL_BOLD: ${{ secrets.FONT_BESPOKE_STENCIL_BOLD }}
          FONT_SUPREME_REGULAR: ${{ secrets.FONT_SUPREME_REGULAR }}
        run: |
          mkdir -p public/fonts
          echo "$FONT_BESPOKE_STENCIL_BOLD" | base64 -d > public/fonts/BespokeStencil-Bold.woff2
          echo "$FONT_SUPREME_REGULAR" | base64 -d > public/fonts/Supreme-Regular.woff2

      - name: Build site
        env:
          VITE_BASE: ${{ vars.VITE_BASE || '/Sons-of-damascene/' }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
